<!doctype html>
<meta charset="utf-8">
<title>LyricStage extension host</title>
<script>
  let requestSequence = 0;
  window.__extensionContentReady = false;
  window.addEventListener('message', (event) => {
    if (event.source === window && event.data?.kind === 'extension-content-ready') {
      window.__extensionContentReady = true;
    }
  });
  window.__requestExtensionContent = (command) => new Promise((resolve, reject) => {
    const requestId = `content-${++requestSequence}`;
    const timeout = setTimeout(() => {
      window.removeEventListener('message', onMessage);
      reject(new Error('content request timed out'));
    }, 5000);
    function onMessage(event) {
      if (event.source !== window) return;
      const message = event.data;
      if (
        !message
        || message.kind !== 'extension-content-response'
        || message.requestId !== requestId
      ) return;
      clearTimeout(timeout);
      window.removeEventListener('message', onMessage);
      resolve(message.response);
    }
    window.addEventListener('message', onMessage);
    window.postMessage({
      kind: 'extension-content-request',
      requestId,
      command,
    }, '*');
  });
  window.__requestExtensionDiagnostics = (command) => new Promise((resolve, reject) => {
    const requestId = `diagnostics-${++requestSequence}`;
    const timeout = setTimeout(() => {
      window.removeEventListener('message', onMessage);
      reject(new Error('diagnostics request timed out'));
    }, 5000);
    function onMessage(event) {
      if (event.source !== window) return;
      const message = event.data;
      if (
        !message
        || message.kind !== 'lyric-stage-extension-diagnostics-response'
        || message.requestId !== requestId
      ) return;
      clearTimeout(timeout);
      window.removeEventListener('message', onMessage);
      resolve(message.response);
    }
    window.addEventListener('message', onMessage);
    window.postMessage({
      kind: 'lyric-stage-extension-diagnostics-control',
      requestId,
      command,
    }, '*');
  });
  window.__requestExtensionTestFeed = (payload) => new Promise((resolve, reject) => {
    const requestId = `test-feed-${++requestSequence}`;
    const timeout = setTimeout(() => {
      window.removeEventListener('message', onMessage);
      reject(new Error('test feed request timed out'));
    }, 5000);
    function onMessage(event) {
      if (event.source !== window) return;
      const message = event.data;
      if (
        !message
        || message.kind !== 'lyric-stage-extension-test-feed-response'
        || message.requestId !== requestId
      ) return;
      clearTimeout(timeout);
      window.removeEventListener('message', onMessage);
      resolve(message.response);
    }
    window.addEventListener('message', onMessage);
    window.postMessage({
      kind: 'lyric-stage-extension-test-feed',
      requestId,
      ...payload,
    }, '*');
  });
</script>
<body>
  <h1>LyricStage extension content host</h1>
</body>
